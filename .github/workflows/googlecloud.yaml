steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build container image'
  args: [
    'build',
    '.',
    '-t',
    'europe-west1-docker.pkg.dev/exammlops/my-container/cloudbuild:latest',
    '-f',
    'dockerfiles/cloudtrain.dockerfile .'
  ]
- name: 'gcr.io/cloud-builders/docker'
  id: 'Push container image'
  args: [
    'push',
    'europe-west1-docker.pkg.dev/exammlops/my-container/cloudbuild:latest'
  ]
options:
  logging: CLOUD_LOGGING_ONLY
