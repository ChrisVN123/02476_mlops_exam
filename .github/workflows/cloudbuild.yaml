name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - DockerBuild
  pull_request:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate with Google Cloud
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Set up Google Cloud CLI
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          export_default_credentials: true

      # Configure Docker to use Google Cloud's container registry
      - name: Configure Docker for Google Cloud
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Get directory content (ls)
        run: ls
      - name: Ensure data directory exists
        run: mkdir -p ./data
      - name: Change to data directory
        run: cd data
      - name: Get directory content (ls)
        run: ls

      - name: Download test data from Google Cloud Storage
        run: gsutil cp -r gs://exam_mlops_data_bucket/dvc/data/* ./data/

      # Build the Docker image
      - name: Build Docker image
        run: |
          docker build -t europe-west1-docker.pkg.dev/exammlops/my-container/cloudbuild:latest -f dockerfiles/cloudtrain.dockerfile .

      # Push the Docker image to the container registry
      - name: Push Docker image to GCP
        run: |
          docker push europe-west1-docker.pkg.dev/exammlops/my-container/cloudbuild:latest
